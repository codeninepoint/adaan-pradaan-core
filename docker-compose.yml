services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tenant
      POSTGRES_PASSWORD: tenant
      POSTGRES_DB: tenant_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenant -d tenant_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: adaan-pradaan-core:latest
    ports:
      - "8000:8000"
    environment:
      TENANT_APP_ENV: dev
      TENANT_DATABASE_URL: postgresql+asyncpg://tenant:tenant@postgres:5432/tenant_platform
      TENANT_JWT_SECRET: dev-secret-change-in-production
      TENANT_KEYCLOAK_MODE: fake
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
