services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tenant
      POSTGRES_PASSWORD: tenant
      POSTGRES_DB: tenant_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenant -d tenant_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
