name: Demo Pi Release

# Triggers when a demo-* tag is pushed to THIS repo (adaan-pradaan-core).
# Builds Debian/glibc (gnu) artifacts for Raspberry Pi OS by default.
on:
  push:
    tags:
      - "demo-*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create/publish (e.g. demo-0.1.2)"
        required: true
        type: string

permissions:
  contents: write

env:
  NEXT_PUBLIC_API_URL: /api
  LIBC: gnu

jobs:
  package-ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack ops bundle
        run: |
          chmod +x deploy/demo-alpine/scripts/*.sh deploy/demo-alpine/install-demo.sh
          ./deploy/demo-alpine/scripts/package-ops.sh
          cp deploy/demo-alpine/install-demo.sh dist/install-demo.sh
          chmod +x dist/install-demo.sh

      - uses: actions/upload-artifact@v4
        with:
          name: demo-ops
          path: |
            dist/adaan-demo-pi-ops.tar.gz
            dist/install-demo.sh

  package-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Core aarch64 gnu (Debian) tarball
        run: |
          chmod +x deploy/demo-alpine/scripts/*.sh
          mkdir -p dist
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e OUT_DIR=/workspace/dist \
            -e LIBC=gnu \
            python:3.12-slim \
            sh /workspace/deploy/demo-alpine/scripts/package-core.sh --libc gnu

      - uses: actions/upload-artifact@v4
        with:
          name: demo-core
          path: dist/adaan-pradaan-core-linux-aarch64-gnu.tar.gz

  package-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout UI repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/adan-pradan-ui
          path: adan-pradan-ui
          token: ${{ secrets.DEMO_UI_CHECKOUT_TOKEN != '' && secrets.DEMO_UI_CHECKOUT_TOKEN || github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build UI aarch64 gnu (Debian) tarball
        run: |
          chmod +x deploy/demo-alpine/scripts/*.sh
          mkdir -p dist
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e OUT_DIR=/workspace/dist \
            -e NEXT_PUBLIC_API_URL=/api \
            -e LIBC=gnu \
            node:22-bookworm \
            sh /workspace/deploy/demo-alpine/scripts/package-ui.sh --libc gnu

      - uses: actions/upload-artifact@v4
        with:
          name: demo-ui
          path: dist/adan-pradan-ui-standalone-linux-aarch64-gnu.tar.gz

  release:
    needs: [package-ops, package-core, package-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum \
            adaan-pradaan-core-linux-aarch64-gnu.tar.gz \
            adan-pradan-ui-standalone-linux-aarch64-gnu.tar.gz \
            adaan-demo-pi-ops.tar.gz \
            install-demo.sh \
            > SHA256SUMS
          ls -lh
          cat SHA256SUMS

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Demo ${{ steps.tag.outputs.name }}
          body: |
            Raspberry Pi OS / Debian (aarch64, glibc) demo artifacts.

            On the Pi (Raspberry Pi OS):
            ```sh
            sudo apt-get update && sudo apt-get install -y curl
            curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/install-demo.sh" -o install-demo.sh
            chmod +x install-demo.sh
            sudo ./install-demo.sh --repo ${{ github.repository }} --version ${{ steps.tag.outputs.name }}
            ```

            Artifacts use `*-linux-aarch64-gnu.tar.gz` (not Alpine musl).
            UI calls same-origin `/api` via nginx.
          files: |
            dist/adaan-pradaan-core-linux-aarch64-gnu.tar.gz
            dist/adan-pradan-ui-standalone-linux-aarch64-gnu.tar.gz
            dist/adaan-demo-pi-ops.tar.gz
            dist/install-demo.sh
            dist/SHA256SUMS
          generate_release_notes: true
