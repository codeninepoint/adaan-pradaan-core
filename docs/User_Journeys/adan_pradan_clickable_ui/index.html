<style>

.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.sidebar{background:#111d36;color:#eaf0ff;padding:20px 14px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;gap:10px;align-items:center;padding:5px 8px 18px;border-bottom:1px solid #31405d}.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#79a6ff,#5265d9);display:grid;place-items:center;font-weight:900;color:white}.brand strong{display:block;font-size:15px}.brand small{color:#aab7d1;font-size:11px}.portal-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#aab7d1;padding:0 10px}.portal-select{width:100%;padding:10px;border:1px solid #3c4b68;border-radius:9px;background:#1d2b49;color:white}.nav{display:flex;flex-direction:column;gap:4px}.nav button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;color:#c6d0e5;text-align:left;padding:10px 12px;border-radius:9px;font-size:13px}.nav button:hover,.nav button.active{background:#293b62;color:#fff}.nav .nav-icon{width:19px;text-align:center}.sidebar-footer{margin-top:auto;color:#9eabc4;font-size:11px;padding:12px;border-top:1px solid #31405d;line-height:1.6}
.main{min-width:0}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:16px;position:sticky;top:0;z-index:5}.crumb{font-size:12px;color:var(--muted)}.top-actions{display:flex;gap:10px;align-items:center}.searchbox{position:relative}.searchbox input{width:min(260px,24vw);border:1px solid var(--line);border-radius:9px;padding:10px 12px 10px 34px;background:#fafbfe}.searchbox span{position:absolute;left:11px;top:9px;color:#98a2b3}.avatar{width:34px;height:34px;border-radius:50%;background:#e9edff;color:#3049a6;display:grid;place-items:center;font-size:12px;font-weight:700}.content{padding:28px;max-width:1600px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}.page-head h1{font-size:27px;margin:0 0 7px;letter-spacing:-.03em}.page-head p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;border-radius:9px;padding:10px 13px;color:#344054;font-size:12px;font-weight:700}.btn:hover{filter:brightness(.98);box-shadow:0 2px 7px #10182810}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.danger{color:var(--red);border-color:#f3b8b3}.btn.small{padding:6px 9px;font-size:11px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.stat{padding:17px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{width:30px;height:30px;display:grid;place-items:center;background:var(--blue2);border-radius:9px}.stat-value{font-size:27px;font-weight:800;letter-spacing:-.04em;margin:12px 0 5px}.stat-foot{font-size:11px;color:var(--muted)}.up{color:var(--green);font-weight:700}.panel{margin-bottom:18px;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:17px 19px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:14px;margin:0}.panel-head p{margin:5px 0 0;color:var(--muted);font-size:11px}.panel-body{padding:18px}.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:16px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th{text-align:left;background:#fafbfe;color:#667085;font-weight:700;font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:12px 16px;border-bottom:1px solid var(--line)}td{padding:13px 16px;border-bottom:1px solid #eef0f5}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafbff}.person{display:flex;align-items:center;gap:9px}.mini-avatar{width:29px;height:29px;border-radius:9px;background:#eef2ff;color:#4558a8;display:grid;place-items:center;font-weight:800;font-size:10px}.muted{color:var(--muted)}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800;background:#eef2f6;color:#475467}.pill.green{background:var(--greenbg);color:var(--green)}.pill.amber{background:var(--amberbg);color:var(--amber)}.pill.red{background:var(--redbg);color:var(--red)}.pill.blue{background:var(--blue2);color:#3049a6}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid #d0d5dd;border-radius:8px;padding:9px 11px;background:white;color:var(--ink);font-size:12px;min-width:0}.toolbar input{min-width:200px}.toolbar select{min-width:120px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field label{font-size:11px;color:#475467;font-weight:800}.field input,.field select,.field textarea{width:100%;font-size:13px}.field textarea{min-height:85px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.empty{padding:30px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.product-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:white}.product-art{height:120px;display:grid;place-items:center;font-size:44px;background:linear-gradient(135deg,#f0f4ff,#f9f4ed)}.product-info{padding:14px}.product-info h3{font-size:13px;margin:0 0 5px}.product-info p{font-size:11px;color:var(--muted);margin:0 0 12px}.price-row{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px}.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.step{padding:9px 12px;border-radius:8px;background:#f0f2f7;color:#667085;font-size:11px;font-weight:700}.step.active{background:var(--blue2);color:#3049a6}.notice{border:1px solid #cbd8ff;background:#f5f7ff;color:#3049a6;border-radius:10px;padding:13px;font-size:12px;line-height:1.5;margin-bottom:15px}.list{display:flex;flex-direction:column;gap:0}.list-row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #eef0f5;font-size:12px}.list-row:last-child{border-bottom:0}.list-row strong{display:block;margin-bottom:4px}.list-row small{color:var(--muted)}.bar{height:7px;border-radius:99px;background:#edf0f6;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;background:#5974e8;border-radius:99px}.modal-backdrop{position:fixed;inset:0;background:#10182880;display:none;align-items:center;justify-content:center;z-index:20;padding:18px}.modal-backdrop.open{display:flex}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:white;border-radius:16px;box-shadow:0 20px 70px #10182840}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:16px;margin:0}.modal-body{padding:20px}.modal-foot{padding:15px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.xbtn{border:0;background:transparent;font-size:22px;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;z-index:30;background:#14213d;color:white;padding:13px 17px;border-radius:10px;box-shadow:0 8px 30px #10182840;font-size:12px;display:none;max-width:350px}.toast.show{display:block;animation:pop .2s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}.mobile-menu{display:none}.chart{display:flex;align-items:end;gap:10px;height:145px;padding:10px 4px 0}.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:6px;height:100%}.chart-col span{width:min(30px,75%);background:linear-gradient(180deg,#7c91f2,#3858d6);border-radius:6px 6px 2px 2px;min-height:8px}.chart-col small{font-size:9px;color:var(--muted)}.chart-col b{font-size:10px;color:#475467}.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.footer-note{font-size:10px;color:var(--muted);padding:10px 0 0}.check-row{display:flex;gap:10px;align-items:flex-start;font-size:12px;padding:10px 0;border-bottom:1px solid #eef0f5}.check-row input{margin-top:2px}.route-hint{font-size:10px;color:#9eabc4;margin:0 8px 6px}
@media(max-width:1000px){.app{grid-template-columns:215px minmax(0,1fr)}.content{padding:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}
@media(max-width:700px){.app{display:block}.sidebar{display:none;position:fixed;inset:0 auto 0 0;width:270px;z-index:15;overflow:auto}.sidebar.mobile-open{display:flex}.topbar{height:60px;padding:0 14px}.mobile-menu{display:inline-flex}.crumb{display:none}.searchbox input{width:150px}.content{padding:18px 13px}.page-head{display:block}.page-head .actions{margin-top:15px}.page-head h1{font-size:23px}.grid{gap:9px}.stat{padding:13px}.stat-value{font-size:23px}.product-grid,.two-col,.form-grid{grid-template-columns:1fr}.panel-head{padding:14px}.panel-body{padding:14px}.top-actions{gap:6px}}

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="logo">AP</div><div><strong>Adan Pradan</strong><small>Marketplace workspace</small></div></div>
 <div><div class="portal-label">Active workspace</div><select class="portal-select" id="portalSelect" aria-label="Select portal"></select></div>
 <div><div class="portal-label">Workspace navigation</div><nav class="nav" id="nav"></nav></div>
 <div class="sidebar-footer">Clickable frontend demo<br>Sample data · No backend connected<br><span style="color:#7f94c3">Prototype v2.0</span></div>
</aside>
<main class="main">
<header class="topbar">
 <div style="display:flex;align-items:center;gap:12px"><button class="btn mobile-menu" id="mobileMenu">☰</button><div class="crumb" id="crumb">Adan Pradan / Overview</div></div>
 <div class="top-actions"><div class="searchbox"><span>⌕</span><input id="globalSearch" placeholder="Search this screen…" aria-label="Search this screen"></div><button class="btn" id="notifBtn" title="Notifications">♧ <span class="muted">2</span></button><div class="avatar" id="userAvatar">AP</div></div>
</header>
<section class="content" id="content"></section>
</main>
</div>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
 <div class="modal"><div class="modal-head"><h2 id="modalTitle">Create item</h2><button class="xbtn" id="closeModal" aria-label="Close dialog">×</button></div><form id="modalForm"><div class="modal-body" id="modalBody"></div><div class="modal-foot"><button type="button" class="btn" id="cancelModal">Cancel</button><button type="submit" class="btn primary" id="saveModal">Save changes</button></div></form></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const screens = [{"id": "platform-admin", "portal": "Platform Admin", "label": "Overview"}, {"id": "admin-organizations", "portal": "Platform Admin", "label": "Organizations"}, {"id": "admin-vendors", "portal": "Platform Admin", "label": "Vendors"}, {"id": "admin-catalog", "portal": "Platform Admin", "label": "Catalog Approval"}, {"id": "admin-orders", "portal": "Platform Admin", "label": "All Orders"}, {"id": "admin-finance", "portal": "Platform Admin", "label": "Finance & Settlements"}, {"id": "admin-plugins", "portal": "Platform Admin", "label": "Plugin Registry"}, {"id": "admin-audit", "portal": "Platform Admin", "label": "Audit & Security"}, {"id": "organization-admin", "portal": "Organization Admin", "label": "Overview"}, {"id": "tenant-members", "portal": "Organization Admin", "label": "Members & Roles"}, {"id": "tenant-stores", "portal": "Organization Admin", "label": "Stores"}, {"id": "tenant-settings", "portal": "Organization Admin", "label": "Organization Settings"}, {"id": "tenant-reports", "portal": "Organization Admin", "label": "Reports"}, {"id": "tenant-activity", "portal": "Organization Admin", "label": "Activity Log"}, {"id": "vendor-portal", "portal": "Vendor Portal", "label": "Overview"}, {"id": "vendor-products", "portal": "Vendor Portal", "label": "Products"}, {"id": "vendor-inventory", "portal": "Vendor Portal", "label": "Inventory"}, {"id": "vendor-orders", "portal": "Vendor Portal", "label": "Orders"}, {"id": "vendor-fulfillment", "portal": "Vendor Portal", "label": "Fulfilment & Shipping"}, {"id": "vendor-returns", "portal": "Vendor Portal", "label": "Returns"}, {"id": "vendor-finance", "portal": "Vendor Portal", "label": "Finance"}, {"id": "vendor-settings", "portal": "Vendor Portal", "label": "Business Settings"}, {"id": "vendor-plugin-portal", "portal": "Vendor Plugin Portal", "label": "Overview"}, {"id": "plugin-discover", "portal": "Vendor Plugin Portal", "label": "Discover Plugins"}, {"id": "plugin-installed", "portal": "Vendor Plugin Portal", "label": "Installed Plugins"}, {"id": "plugin-configuration", "portal": "Vendor Plugin Portal", "label": "Plugin Configuration"}, {"id": "plugin-logs", "portal": "Vendor Plugin Portal", "label": "Plugin Logs"}, {"id": "customer-marketplace", "portal": "Customer Marketplace", "label": "Shop"}, {"id": "customer-wishlist", "portal": "Customer Marketplace", "label": "Wishlist"}, {"id": "customer-cart", "portal": "Customer Marketplace", "label": "Cart & Checkout"}, {"id": "customer-orders", "portal": "Customer Marketplace", "label": "My Orders"}, {"id": "customer-returns", "portal": "Customer Marketplace", "label": "Returns & Refunds"}, {"id": "customer-addresses", "portal": "Customer Marketplace", "label": "Addresses"}, {"id": "customer-support", "portal": "Customer Marketplace", "label": "Help & Support"}];
const portalOrder = ["Platform Admin","Organization Admin","Vendor Portal","Vendor Plugin Portal","Customer Marketplace"];
const portalInfo = {
"Platform Admin":{desc:"Manage the marketplace platform, tenants, vendors, governance and financial controls.",icon:"◈"},
"Organization Admin":{desc:"Manage your organization, members, stores, tenant-level policies and reporting.",icon:"▦"},
"Vendor Portal":{desc:"Manage your catalogue, stock, orders, fulfilment, returns and settlements.",icon:"▣"},
"Vendor Plugin Portal":{desc:"Discover, configure and monitor plugins enabled for your vendor workspace.",icon:"⌘"},
"Customer Marketplace":{desc:"Discover products, manage your cart, track orders and get support.",icon:"🛍"}
};
const state = {
"admin-organizations":[["Ninepoint Retail","ORG-1001","2 members","Active"],["Urban Essentials","ORG-1002","8 members","Active"],["Northstar Digital","ORG-1003","5 members","Pending"]],
"admin-vendors":[["PaperNest Supplies","Stationery","Verified","Active"],["GiftOrbit","Gifts & Lifestyle","Review","Pending"],["CodeCraft Labs","Software","Verified","Active"]],
"admin-catalog":[["Premium Notebook Set","PaperNest Supplies","Stationery","Pending"],["Personalised Gift Box","GiftOrbit","Gifts","Pending"],["Team Planner Pro","CodeCraft Labs","Software","Approved"]],
"admin-orders":[["ORD-2026-1042","Aarav Mehta","₹2,450","Processing"],["ORD-2026-1041","Isha Shah","₹899","Shipped"],["ORD-2026-1040","Kabir Rao","₹5,200","Delivered"]],
"admin-finance":[["SET-2026-019","PaperNest Supplies","₹42,800","Ready"],["SET-2026-018","GiftOrbit","₹18,500","On hold"],["SET-2026-017","CodeCraft Labs","₹67,200","Paid"]],
"admin-plugins":[["Shipping Connect","Logistics","v1.4.2","Enabled"],["GST Invoice Pro","Finance","v2.1.0","Enabled"],["Vendor Analytics","Analytics","v1.2.0","Review"]],
"admin-audit":[["Role changed","Neha Admin","Today, 10:42","Success"],["Vendor status updated","Platform Admin","Today, 09:18","Success"],["Failed sign-in","Unknown","Yesterday, 21:07","Blocked"]],
"tenant-members":[["Neha Thakur","neha@example.com","Organization Admin","Active"],["Rohan Mehta","rohan@example.com","Catalog Manager","Active"],["Priya Shah","priya@example.com","Order Manager","Invited"]],
"tenant-stores":[["Ninepoint Main Store","Mumbai","Active"],["Ninepoint B2B","Online","Draft"]],
"tenant-activity":[["Member invited","Neha Thakur","Today, 10:30"],["Store settings changed","Rohan Mehta","Yesterday, 16:18"],["Report exported","Neha Thakur","Yesterday, 11:02"]],
"vendor-products":[["Premium Notebook Set","ST-1001","₹499","124","Published"],["Executive Pen Pack","ST-1002","₹299","86","Published"],["Custom Gift Hamper","GF-1003","₹1,299","0","Draft"]],
"vendor-inventory":[["Premium Notebook Set","WH-MUM-01","124","20","In stock"],["Executive Pen Pack","WH-MUM-01","8","15","Low stock"],["Custom Gift Hamper","WH-MUM-01","0","10","Out of stock"]],
"vendor-orders":[["ORD-2026-1042","Aarav Mehta","2 items","₹2,450","New"],["ORD-2026-1038","Mira Patel","1 item","₹499","Processing"],["ORD-2026-1029","Kabir Rao","3 items","₹3,100","Shipped"]],
"vendor-fulfillment":[["FUL-1042","ORD-2026-1042","BlueDart","Label pending"],["FUL-1038","ORD-2026-1038","Delhivery","In transit"],["FUL-1029","ORD-2026-1029","DTDC","Delivered"]],
"vendor-returns":[["RET-2026-012","ORD-2026-1008","Damaged item","Requested"],["RET-2026-011","ORD-2026-0998","Wrong item","Approved"]],
"vendor-finance":[["PAY-019","Order settlement","₹42,800","Ready"],["PAY-018","Order settlement","₹18,500","Processing"],["INV-2026-08","Platform commission","-₹4,280","Posted"]],
"plugin-installed":[["Shipping Connect","v1.4.2","Enabled"],["GST Invoice Pro","v2.1.0","Enabled"],["Vendor Analytics","v1.2.0","Disabled"]],
"plugin-logs":[["Shipping Connect","Order sync","Success","10:42:16"],["GST Invoice Pro","Invoice generation","Success","10:30:02"],["Shipping Connect","Carrier API timeout","Warning","09:58:44"]],
"customer-orders":[["ORD-2026-1042","Premium Notebook Set + 1","₹2,450","Processing"],["ORD-2026-1031","Executive Pen Pack","₹299","Delivered"],["ORD-2026-1008","Gift Hamper","₹1,299","Return requested"]],
"customer-returns":[["RET-2026-012","ORD-2026-1008","Damaged item","Under review"]],
"customer-addresses":[["Home","Aarav Mehta","Mumbai, Maharashtra","Default"],["Office","Aarav Mehta","Andheri East, Mumbai",""]],
};
let current = location.hash.replace("#","") || "platform-admin";
let cart = [];
let wishlist = ["Premium Notebook Set"];
let customRows = {};
let modalConfig = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function getScreen(id){return screens.find(s=>s.id===id)||screens[0]}
function getPortalScreens(portal){return screens.filter(s=>s.portal===portal)}
function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.classList.remove("show"),2800)}
function go(id){current=id;location.hash=id;$("#sidebar").classList.remove("mobile-open");render()}
function renderNav(){
 const active=getScreen(current), portal=active.portal;
 $("#portalSelect").innerHTML=portalOrder.map(p=>`<option ${p===portal?"selected":""}>${p}</option>`).join("");
 $("#nav").innerHTML=getPortalScreens(portal).map(s=>`<button data-go="${s.id}" class="${s.id===current?"active":""}"><span class="nav-icon">${portalInfo[portal].icon}</span><span>${esc(s.label)}</span></button>`).join("");
 $("#nav").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
 $("#crumb").textContent=`Adan Pradan / ${portal} / ${active.label}`;
 $("#userAvatar").textContent=portal==="Customer Marketplace"?"AM":portal==="Vendor Portal"?"PN":portal==="Organization Admin"?"NT":"AP";
}
function stats(items){return `<div class="grid">${items.map((x,i)=>`<div class="stat"><div class="stat-top"><span>${x[0]}</span><span class="stat-icon">${["◫","↗","◷","✓"][i%4]}</span></div><div class="stat-value">${x[1]}</div><div class="stat-foot">${x[2]}</div></div>`).join("")}</div>`}
function pill(text){let t=String(text||"");let c=/active|approved|published|paid|delivered|success|enabled|verified|in stock/i.test(t)?"green":/pending|review|processing|requested|ready|low stock|warning|invited|draft|in transit/i.test(t)?"amber":/blocked|failed|hold|out of stock|disabled|rejected/i.test(t)?"red":"blue";return `<span class="pill ${c}">${esc(t)}</span>`}
function tablePanel(title, rows, headers, opts={}){
 let rowsHtml=rows.map((r,i)=>`<tr>${r.map((v,j)=>`<td>${j===r.length-1?pill(v):esc(v)}</td>`).join("")}<td><div class="actions"><button class="btn small" data-action="view" data-index="${i}">View</button><button class="btn small" data-action="edit" data-index="${i}">Edit</button><button class="btn small" data-action="more" data-index="${i}">•••</button></div></td></tr>`).join("");
 return `<div class="panel" data-table-panel><div class="panel-head"><div><h2>${esc(title)}</h2><p>${rows.length} sample records · changes are local to this demo</p></div><button class="btn primary" data-create="${esc(opts.createLabel||"New item")}">＋ ${esc(opts.createLabel||"Add item")}</button></div><div class="toolbar"><input data-filter placeholder="Filter records…" aria-label="Filter records"><select data-status><option value="">All statuses</option><option>Active</option><option>Pending</option><option>Processing</option><option>Approved</option><option>Draft</option><option>Delivered</option></select><button class="btn" data-export>Export CSV</button></div><div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}<th>Actions</th></tr></thead><tbody>${rowsHtml||`<tr><td colspan="${headers.length+1}">No records yet.</td></tr>`}</tbody></table></div><div class="panel-body footer-note">Demo behavior: View opens record details, Edit opens a form, Add creates a sample record, and Export downloads CSV.</div></div>`;
}
function standardRows(id){
 let rows=(state[id]||customRows[id]||[]);
 return rows.map(r=>[...r]);
}
function dataTable(id,title,headers,createLabel){return tablePanel(title,standardRows(id),headers,{createLabel})}

function wireContent(){
 $("#content").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
 $("#content").querySelectorAll("[data-toast]").forEach(b=>b.onclick=()=>toast(b.dataset.toast));
 $("#content").querySelectorAll("[data-create]").forEach(b=>b.onclick=()=>openCreate(b.dataset.create));
 $("#content").querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>{let a=b.dataset.quick;if(screens.some(s=>s.id===a))go(a);else openCreate(a)});
 $("#content").querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>rowAction(b.dataset.action,+b.dataset.index,b.closest("tr")));
 $("#content").querySelectorAll("[data-filter]").forEach(inp=>inp.addEventListener("input",()=>filterTable(inp)));
 $("#content").querySelectorAll("[data-status]").forEach(sel=>sel.addEventListener("change",()=>filterTable(sel)));
 $("#content").querySelectorAll("[data-export]").forEach(b=>b.onclick=()=>exportTable(b.closest(".panel")));
 const shopSearch=$("#shopSearch"), shopCategory=$("#shopCategory"), shopSort=$("#shopSort");
 if(shopSearch){const update=()=>{let q=shopSearch.value.toLowerCase(),cat=shopCategory.value,items=products.filter(p=>(p.name+" "+p.category+" "+p.desc).toLowerCase().includes(q)&&(!cat||p.category===cat));if(shopSort.value==="low")items.sort((a,b)=>a.price-b.price);if(shopSort.value==="high")items.sort((a,b)=>b.price-a.price);$("#productsGrid").innerHTML=productCards(items)||`<div class="empty">No matching products.</div>`;wireProductCards()};[shopSearch,shopCategory,shopSort].forEach(e=>e.addEventListener("input",update));wireProductCards()}
 const pluginSearch=$("#pluginSearch");if(pluginSearch){pluginSearch.addEventListener("input",()=>$("#pluginGrid").querySelectorAll(".product-card").forEach(c=>c.style.display=c.textContent.toLowerCase().includes(pluginSearch.value.toLowerCase())?"":"none"))}
 $("#content").querySelectorAll("[data-export-report]").forEach(b=>b.onclick=()=>{download("organization-report.csv","Metric,Value\\nGross sales,482450\\nOrders,284\\nAverage order value,1698\\nReturn rate,2.4%");toast("Report exported")});
 $("#content").querySelectorAll("[data-save-preferences]").forEach(b=>b.onclick=()=>toast("Preferences saved in this demo"));
 $("#content").querySelectorAll("[data-test-connection]").forEach(b=>b.onclick=()=>toast("Connection test passed (simulated)"));
 $("#content").querySelectorAll("[data-install]").forEach(b=>b.onclick=()=>{let name=b.dataset.install;let r=state["plugin-installed"]||(state["plugin-installed"]=[]);if(!r.some(x=>x[0]===name))r.push([name,"v1.0.0","Enabled"]);toast(name+" installed (demo)");if(current==="plugin-discover"){} });
 $("#content").querySelectorAll("[data-plugin-info]").forEach(b=>b.onclick=()=>openDetail("Plugin details",b.dataset.pluginInfo,"Demo plugin information, permissions and configuration options."));
 $("#content").querySelectorAll("[data-add-cart]").forEach(b=>b.onclick=()=>{cart.push(b.dataset.addCart);toast("Added to cart: "+b.dataset.addCart);if(current==="customer-marketplace")render()});
 $("#content").querySelectorAll("[data-wish]").forEach(b=>b.onclick=()=>{let n=b.dataset.wish;if(wishlist.includes(n))wishlist=wishlist.filter(x=>x!==n);else wishlist.push(n);toast(wishlist.includes(n)?"Saved to wishlist":"Removed from wishlist");render()});
 $("#content").querySelectorAll("[data-product-detail]").forEach(b=>b.onclick=()=>{let p=products.find(x=>x.name===b.dataset.productDetail);openDetail(p.name,`₹${p.price}`,`${p.desc}. Category: ${p.category}. Demo stock: ${p.stock}.`)});
 $("#content").querySelectorAll("[data-remove-cart]").forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.removeCart,1);render()});
 $("#content").querySelectorAll("[data-action-cart='clear']").forEach(b=>b.onclick=()=>{cart=[];render();toast("Cart cleared")});
 $("#content").querySelectorAll("[data-checkout]").forEach(b=>b.onclick=()=>openCheckout());
 $("#content").querySelectorAll("#configForm,#settingsForm,#supportForm").forEach(f=>f.onsubmit=e=>{e.preventDefault();toast("Saved successfully (demo only)")});
}
function wireProductCards(){ $("#content").querySelectorAll("[data-add-cart]").forEach(b=>b.onclick=()=>{cart.push(b.dataset.addCart);toast("Added to cart: "+b.dataset.addCart);render()});$("#content").querySelectorAll("[data-wish]").forEach(b=>b.onclick=()=>{let n=b.dataset.wish;wishlist=wishlist.includes(n)?wishlist.filter(x=>x!==n):[...wishlist,n];render()});$("#content").querySelectorAll("[data-product-detail]").forEach(b=>b.onclick=()=>{let p=products.find(x=>x.name===b.dataset.productDetail);openDetail(p.name,`₹${p.price}`,p.desc)})}
function filterTable(el){let panel=el.closest(".panel"), q=(panel.querySelector("[data-filter]")?.value||"").toLowerCase(),status=panel.querySelector("[data-status]")?.value||"";panel.querySelectorAll("tbody tr").forEach(tr=>{tr.style.display=tr.textContent.toLowerCase().includes(q)&&(!status||tr.textContent.toLowerCase().includes(status.toLowerCase()))?"":"none"})}
function rowAction(action,index,tr){let vals=[...tr.querySelectorAll("td")].slice(0,-1).map(td=>td.textContent.trim());if(action==="view")openDetail("Record details",vals[0]||"Record",vals.map((v,i)=>`Field ${i+1}: ${v}`).join("\\n"));else if(action==="edit")openEdit(vals);else openDetail("More actions",vals[0]||"Record","Choose an action for this record: review, approve, reject, archive, or inspect history.")}
function openDetail(title,subtitle,body){$("#modalTitle").textContent=title;$("#modalBody").innerHTML=`<div class="notice"><strong>${esc(subtitle)}</strong></div><div style="font-size:13px;line-height:1.8;white-space:pre-line">${esc(body)}</div><div class="actions" style="margin-top:16px"><button class="btn" type="button" data-detail-action="Approve">Approve</button><button class="btn" type="button" data-detail-action="Reject">Reject</button><button class="btn" type="button" data-detail-action="Archive">Archive</button></div>`;$("#saveModal").style.display="none";$("#modalBackdrop").classList.add("open");$("#modalBody").querySelectorAll("[data-detail-action]").forEach(b=>b.onclick=()=>{closeModal();toast(b.dataset.detailAction+" action recorded in demo")})}
function openCreate(label){let fields=label.toLowerCase().includes("member")?["Full name","Email","Role"]:label.toLowerCase().includes("product")?["Product name","SKU","Price (INR)","Category"]:label.toLowerCase().includes("organization")?["Organization name","Contact email","Plan"]:label.toLowerCase().includes("vendor")?["Vendor name","Category","Contact email"]:label.toLowerCase().includes("address")?["Address label","Recipient name","Street address","City","Postal code"]:label.toLowerCase().includes("store")?["Store name","Region","Domain"]:label.toLowerCase().includes("plugin")?["Plugin name","Category","Version"]:label.toLowerCase().includes("inventory")||label.toLowerCase().includes("stock")?["Product / SKU","Warehouse","Quantity change","Reason"]:label.toLowerCase().includes("shipment")?["Order ID","Carrier","Tracking number"]:label.toLowerCase().includes("ticket")?["Topic","Order ID","Description"]:["Name / reference","Description","Status"];
 modalConfig={label,fields};$("#modalTitle").textContent=label;$("#modalBody").innerHTML=fields.map((f,i)=>`<div class="field"><label>${esc(f)}</label>${/role|category|plan|status|carrier|reason/i.test(f)?`<select><option>Select ${esc(f.toLowerCase())}</option>${(f.toLowerCase().includes("role")?["Organization Admin","Catalog Manager","Order Manager","Viewer"]:f.toLowerCase().includes("category")?["Stationery","Gifts","Software","Office","Electronics"]:f.toLowerCase().includes("status")?["Active","Pending","Draft"]:f.toLowerCase().includes("carrier")?["BlueDart","Delhivery","DTDC"]:["Standard","Premium","Enterprise"]).map(x=>`<option>${x}</option>`).join("")}</select>`:/description|address/i.test(f)?`<textarea placeholder="${esc(f)}"></textarea>`:`<input ${i===0?"required":""} placeholder="${esc(f)}" ${/email/i.test(f)?'type="email"':/price|quantity|postal/i.test(f)?'type="number" min="0"':'type="text"'}/>`}</div>`).join("");$("#saveModal").style.display="inline-block";$("#saveModal").textContent="Save";$("#modalBackdrop").classList.add("open")}
function openEdit(vals){let fields=vals.map((v,i)=>({label:"Field "+(i+1),value:v}));modalConfig={label:"Edit record",fields:vals};$("#modalTitle").textContent="Edit record";$("#modalBody").innerHTML=fields.map(f=>`<div class="field"><label>${f.label}</label><input value="${esc(f.value)}"></div>`).join("")+`<div class="field"><label>Update status</label><select><option>Keep current status</option><option>Active</option><option>Pending</option><option>Approved</option><option>Rejected</option><option>Archived</option></select></div>`;$("#saveModal").style.display="inline-block";$("#saveModal").textContent="Save changes";$("#modalBackdrop").classList.add("open")}
function openCheckout(){$("#modalTitle").textContent="Checkout · Demo";$("#modalBody").innerHTML=`<div class="steps"><span class="step active">1. Delivery</span><span class="step active">2. Payment</span><span class="step">3. Confirmation</span></div><div class="field"><label>Delivery address</label><select><option>Home — Mumbai, Maharashtra</option><option>Office — Andheri East, Mumbai</option></select></div><div class="field"><label>Payment method</label><select><option>Cash on delivery (demo)</option><option>UPI (simulated)</option><option>Card (simulated)</option></select></div><div class="field"><label>Order note (optional)</label><textarea placeholder="Delivery instructions"></textarea></div><div class="notice">No payment details are collected and no actual transaction will occur.</div>`;$("#saveModal").style.display="inline-block";$("#saveModal").textContent="Place demo order";modalConfig={checkout:true};$("#modalBackdrop").classList.add("open")}
function closeModal(){$("#modalBackdrop").classList.remove("open");modalConfig=null}
function download(name,text){let blob=new Blob([text],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportTable(panel){if(!panel){toast("No table to export");return}let table=panel.querySelector("table");if(!table){toast("No table to export");return}let rows=[...table.querySelectorAll("tr")].map(tr=>[...tr.querySelectorAll("th,td")].slice(0,-1).map(td=>'"'+td.innerText.replace(/"/g,'""')+'"').join(","));download((getScreen(current).id||"data")+".csv",rows.join("\\n"));toast("CSV downloaded")}
$("#modalForm").addEventListener("submit",e=>{e.preventDefault();if(modalConfig?.checkout){closeModal();cart=[];toast("Demo order placed! No payment was processed.");go("customer-orders");return}if(modalConfig){let savedLabel=modalConfig.label||"Record";let id=current;let arr=customRows[id]||(customRows[id]=[]);let vals=[...$("#modalBody").querySelectorAll("input,select,textarea")].map(x=>x.value.trim()).filter(Boolean);if(!arr.length&&state[id])arr=state[id];if(state[id]&&state[id].length){state[id].push(vals.length?vals:[savedLabel,"New record","Active"])}else{arr.push(vals.length?vals:[savedLabel,"Created just now","Active"])}closeModal();render();toast(savedLabel+" saved (demo)");return}closeModal();toast("Saved")});
$("#closeModal").onclick=closeModal;$("#cancelModal").onclick=closeModal;$("#modalBackdrop").addEventListener("click",e=>{if(e.target===$("#modalBackdrop"))closeModal()});
$("#portalSelect").addEventListener("change",e=>go(getPortalScreens(e.target.value)[0].id));
$("#mobileMenu").onclick=()=>$("#sidebar").classList.toggle("mobile-open");
$("#globalSearch").addEventListener("input",e=>{let q=e.target.value.toLowerCase();$("#content").querySelectorAll("tbody tr,.product-card,.list-row").forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q)?"":"none")});
$("#notifBtn").onclick=()=>openDetail("Notifications","2 unread notifications","One order requires attention.\\nA new weekly report is available.");
window.addEventListener("hashchange",()=>{current=location.hash.replace("#","")||"platform-admin";render()});
if(!screens.some(s=>s.id===current))current="platform-admin";
render();
</script>
</body>
