# Adaan Pradaan demo — reverse proxy.
# Debian / Raspberry Pi OS:
#   copy to /etc/nginx/sites-available/adaan && ln -s to sites-enabled
# Alpine:
#   copy to /etc/nginx/http.d/adaan.conf
#
# Browser → nginx :80
#   /      → Next.js standalone 127.0.0.1:3000
#   /api/  → Core uvicorn 127.0.0.1:8000  (strip /api prefix)
#
# UI must be built with NEXT_PUBLIC_API_URL=/api (same-origin).

upstream adaan_ui {
    server 127.0.0.1:3000;
    keepalive 8;
}

upstream adaan_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 32m;

    # Core API — strip /api so FastAPI routes stay at /auth, /vendors, etc.
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://adaan_api/;
    }

    # Exact /api → upstream /
    location = /api {
        return 301 /api/;
    }

    # Next.js UI
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://adaan_ui;
    }
}
